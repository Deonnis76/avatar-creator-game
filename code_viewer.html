var FILES=RAW.map(function(r){return{name:r.n,content:b64d(r.b)};});
var cur=0;
var tabs=document.getElementById("tabs");
FILES.forEach(function(f,i){
    var b=document.createElement("button");
    b.className="tab"+(i===0?" active":"");
    b.textContent=f.name;
    b.onclick=function(){cur=i;document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});b.classList.add("active");show(i);};
    tabs.appendChild(b);
});
function show(i){
    var f=FILES[i];
    document.getElementById("file-label").textContent=f.name;
    document.getElementById("line-count").textContent=f.content.split("\n").length+" строк";
    document.getElementById("code-view").textContent=f.content;
    var btn=document.getElementById("copy-btn");
    btn.textContent="📋 Копировать";btn.classList.remove("copied");
}
function copyCode(){
    navigator.clipboard.writeText(FILES[cur].content).then(function(){
        var b=document.getElementById("copy-btn");
        b.textContent="✅ Скопировано!";b.classList.add("copied");
        setTimeout(function(){b.textContent="📋 Копировать";b.classList.remove("copied");},2000);
    });
}
function downloadFile(){
    var f=FILES[cur];
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([f.content],{type:"text/plain;charset=utf-8"}));
    a.download=f.name;a.click();
}
show(0);
</script>
